<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мәтіндік құжатпен жұмыс істеу — 6-сынып информатика</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb; --blue-dark:#1d4ed8; --purple:#8b5cf6; --purple-light:#ede9fe;
  --bg:#f5f7fc; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
  --radius:16px; --shadow:0 4px 20px rgba(37,99,235,.09);
}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--text); font-size:17px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
/* ---------- HEADER ---------- */
header{
  position:sticky; top:0; z-index:100;
  background:linear-gradient(100deg,#2563eb 0%,#6366f1 55%,#8b5cf6 100%);
  color:#fff; box-shadow:0 4px 22px rgba(37,99,235,.28);
}
.hdr{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:.2px;cursor:pointer}
.brand .logo{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:21px;flex:none}
.brand small{display:block;font-weight:400;font-size:12.5px;opacity:.85;line-height:1.2}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{
  background:rgba(255,255,255,.16); border:none; color:#fff; padding:8px 14px;
  border-radius:10px; font-size:14.5px; cursor:pointer; font-family:inherit;
  transition:.18s; white-space:nowrap;
}
nav button:hover{background:rgba(255,255,255,.32)}
nav button.active{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.12)}
/* ---------- LAYOUT ---------- */
main{max-width:1120px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:32px;line-height:1.25;margin-bottom:12px;color:#111827}
h2{font-size:25px;margin:26px 0 12px;color:#111827}
h3{font-size:20px;margin:22px 0 10px;color:var(--blue-dark)}
h4{font-size:18px;margin:14px 0 8px;color:#111827}
p{margin-bottom:13px}
ul,ol{margin:0 0 14px 24px}
li{margin-bottom:7px}
b,strong{color:#111827}
a{color:var(--blue)}
/* ---------- HERO ---------- */
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#f2f0ff 100%);
  border-radius:22px; padding:34px 30px; box-shadow:var(--shadow);
  border:1px solid #e8ecff; margin-bottom:26px;
}
.hero .badge{display:inline-block;background:var(--purple-light);color:#6d28d9;font-size:13.5px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px;letter-spacing:.3px}
.hero h1{background:linear-gradient(90deg,#2563eb,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:35px}
.hero .sub{font-size:17px;color:var(--muted);font-weight:600;margin-bottom:14px}
.hero p.desc{font-size:17.5px;color:#374151;max-width:820px}
/* ---------- CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:18px;margin-top:18px}
.card{
  background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  border:1px solid #eef1f8;transition:.2s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(37,99,235,.16);border-color:#dbe3ff}
.card .code{
  display:inline-block;background:var(--blue);color:#fff;font-size:13px;font-weight:700;
  padding:4px 12px;border-radius:8px;margin-bottom:12px;align-self:flex-start;
}
.card h3{margin:0 0 8px;font-size:19px;color:#111827}
.card p{color:var(--muted);font-size:15.5px;flex:1}
.card .done{color:var(--green);font-weight:700;font-size:14px;margin-top:8px}
/* ---------- BUTTONS ---------- */
.btn{
  border:none;border-radius:11px;padding:11px 20px;font-size:15.5px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.18s;display:inline-flex;align-items:center;gap:7px;
  justify-content:center;
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#7c3aed}
.btn-ghost{background:#eef2ff;color:var(--blue-dark)}
.btn-ghost:hover{background:#e0e7ff}
.btn-outline{background:#fff;color:var(--blue);border:2px solid #dbe3ff}
.btn-outline:hover{background:#f5f8ff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* ---------- NOTES ---------- */
.note{border-radius:14px;padding:16px 18px;margin:16px 0;border-left:6px solid;font-size:16.3px}
.note b{display:block;margin-bottom:6px;font-size:16px}
.note p:last-child{margin-bottom:0}
.note-remember{background:#eef4ff;border-color:#2563eb}
.note-important{background:#fff7ed;border-color:#f59e0b}
.note-example{background:#f5f3ff;border-color:#8b5cf6}
.note-practice{background:#ecfdf5;border-color:#16a34a}
.note-check{background:#fdf2f8;border-color:#db2777}
details{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px 16px;margin-top:10px}
details summary{cursor:pointer;font-weight:700;color:var(--blue-dark)}
details[open] summary{margin-bottom:9px}
.illus{
  background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1.5px dashed #c7d2fe;border-radius:14px;
  padding:22px;text-align:center;color:#6d28d9;font-size:15px;margin:16px 0;
}
.illus .big{font-size:34px;display:block;margin-bottom:8px}
/* ---------- PROGRESS ---------- */
.progress-wrap{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);border:1px solid #eef1f8;margin:22px 0}
.progress-head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;font-size:16px;flex-wrap:wrap;gap:6px}
.progress-bar{height:14px;background:#eef2ff;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#8b5cf6);border-radius:999px;transition:width .5s ease;width:0}
/* ---------- TABS ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px}
.tabs button{
  background:#eef2ff;border:none;color:#4b5563;padding:10px 18px;border-radius:11px;
  font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;
}
.tabs button:hover{background:#e0e7ff}
.tabs button.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.28)}
/* ---------- TASKS ---------- */
.task{background:#fff;border-radius:16px;padding:22px;box-shadow:var(--shadow);border:1px solid #eef1f8;margin:18px 0}
.task h4{color:var(--blue-dark);margin-top:0}
.task-instr{color:#4b5563;font-size:16px;margin-bottom:14px}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin-bottom:11px;padding:10px;border-radius:11px;background:#f8faff}
.match-left{font-weight:600;font-size:15.8px}
select{
  font-family:inherit;font-size:15.3px;padding:10px 12px;border-radius:10px;border:2px solid #dbe3ff;
  background:#fff;color:var(--text);width:100%;cursor:pointer;
}
select:focus{outline:none;border-color:var(--blue)}
select.good{border-color:var(--green);background:#f0fdf4}
select.bad{border-color:var(--red);background:#fef2f2}
.order-list{list-style:none;margin:0}
.order-item{
  display:flex;align-items:center;gap:12px;background:#f8faff;border:2px solid #e8eeff;
  border-radius:12px;padding:12px 14px;margin-bottom:9px;transition:.18s;
}
.order-item.good{border-color:var(--green);background:#f0fdf4}
.order-item.bad{border-color:var(--red);background:#fef2f2}
.order-text{flex:1;font-size:15.8px}
.order-btns{display:flex;gap:5px;flex:none}
.mini{
  width:34px;height:34px;border-radius:9px;border:none;background:#e0e7ff;color:var(--blue-dark);
  font-size:15px;cursor:pointer;font-family:inherit;transition:.15s;
}
.mini:hover{background:#c7d2fe}
.cls-row{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:center;background:#f8faff;padding:11px;border-radius:11px;margin-bottom:10px}
.cls-text{font-size:15.8px}
.opt{
  display:block;width:100%;text-align:left;background:#f8faff;border:2px solid #e8eeff;border-radius:11px;
  padding:13px 16px;margin-bottom:9px;font-size:16px;font-family:inherit;cursor:pointer;transition:.16s;color:var(--text);
}
.opt:hover{border-color:#c7d2fe;background:#f1f5ff}
.opt.selected{border-color:var(--purple);background:#f5f3ff;font-weight:600}
.opt.good{border-color:var(--green);background:#f0fdf4}
.opt.bad{border-color:var(--red);background:#fef2f2}
.task-feedback{font-weight:700;font-size:16.5px;margin-top:12px;min-height:24px}
.task-feedback.ok{color:var(--green)}
.task-feedback.no{color:var(--red)}
/* ---------- TEST ---------- */
.test-box{background:#fff;border-radius:18px;padding:26px;box-shadow:var(--shadow);border:1px solid #eef1f8}
.q-counter{font-size:14.5px;font-weight:700;color:var(--purple);letter-spacing:.4px;margin-bottom:6px}
.q-text{font-size:19.5px;font-weight:700;margin:8px 0 18px;line-height:1.5}
.result-big{font-size:52px;font-weight:800;background:linear-gradient(90deg,#2563eb,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.stat{background:#f8faff;border-radius:14px;padding:16px;text-align:center;border:1px solid #e8eeff}
.stat .num{font-size:26px;font-weight:800;color:var(--blue-dark)}
.stat .lbl{font-size:14px;color:var(--muted);margin-top:2px}
.wrong-item{background:#fef2f2;border-left:5px solid var(--red);border-radius:11px;padding:14px 16px;margin-bottom:11px}
.wrong-item .qq{font-weight:700;margin-bottom:7px}
.wrong-item .ans{font-size:15.3px}
.wrong-item .ans span{display:block}
.wrong-item .cor{color:var(--green);font-weight:600}
.wrong-item .giv{color:var(--red);font-weight:600}
/* ---------- MISC ---------- */
.section-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:30px 0 14px}
.section-title .ic{width:42px;height:42px;border-radius:13px;background:var(--purple-light);display:grid;place-items:center;font-size:21px;flex:none}
.list-link{
  display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-radius:14px;
  padding:16px 20px;box-shadow:var(--shadow);border:1px solid #eef1f8;margin-bottom:12px;flex-wrap:wrap;
}
.list-link .t{font-weight:700;font-size:17px}
.list-link .s{font-size:14.5px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:14.5px;padding:26px 18px 40px;border-top:1px solid #e8ecf5;margin-top:40px}
.empty{color:var(--muted);font-style:italic}
@media(max-width:720px){
  body{font-size:16px}
  .hdr{padding:10px 14px}
  .brand{font-size:16px}
  .brand .logo{width:34px;height:34px;font-size:18px}
  nav button{padding:7px 11px;font-size:13.5px}
  main{padding:18px 13px 50px}
  .hero{padding:24px 20px}
  .hero h1{font-size:26px}
  h1{font-size:25px}
  h2{font-size:21px}
  .match-row,.cls-row{grid-template-columns:1fr}
  .q-text{font-size:17.5px}
  .test-box{padding:18px}
  .result-big{font-size:42px}
}
</style>
</head>

    <div class="brand" onclick="go('home')">
      <div class="logo">📄</div>

</footer>

<script>
/* =========================================================
   ДЕРЕКТЕР: ТАҚЫРЫПТАР

const topics = [

/* ================= 4.1 ================= */
{
  id:'t1', code:'4.1', title:'Нұсқама және сілтемелер',
  short:'Нұсқама дегеніміз не, сілтеме дегеніміз не және оларды құжатта қалай қолдану керектігін үйренеміз.',
  theory:`
<h3>Нұсқама дегеніміз не?</h3>
<p><b>Нұсқама</b> — белгілі бір жұмысты немесе іс-әрекетті қалай орындау керектігін қадам-қадаммен түсіндіретін қысқа нұсқаулық.</p>
<p>Нұсқамалар күнделікті өмірде жиі кездеседі. Дәріні қалай қабылдау керектігі жазылған қағаз, жаңа телефонды бірінші рет қосқанда шығатын кеңестер, жиһазды жинау схемасы — осының барлығы нұсқама.</p>
<p>Нұсқаманың негізгі белгілері:</p>
<ul>
<li>қысқа және нақты жазылады;</li>
<li>іс-әрекеттер белгілі бір ретпен беріледі;</li>
<li>әр қадам алдыңғы қадамға сүйенеді;</li>
<li>түсініксіз, күрделі сөздер аз қолданылады.</li>
</ul>

<div class="note note-example">
<b>Мысал</b>
<p>«Құжатқа сурет қою» нұсқамасы:<br>
1) курсорды сурет қоятын жерге әкел;<br>
2) «Кірістіру» қойындысын аш;<br>
3) «Сурет» батырмасын бас;<br>
4) компьютердегі файлды таңда;<br>
5) «Кірістіру» батырмасын бас.</p>
</div>

<h3>Сілтеме дегеніміз не?</h3>
<p><b>Сілтеме</b> — мәтін ішінде басқа ақпарат көзіне назар аударатын арнайы белгі. Сілтеме арқылы оқырман қосымша мәліметті басқа жерден таба алады.</p>
<p>Сілтеме ақпараттың қайдан алынғанын көрсетеді. Бұл — әділдік пен дұрыс жұмыстың белгісі.</p>

<h3>Мәтіндік құжаттағы сілтемелер</h3>
<p>Мәтіндік құжатта сілтемелер әртүрлі түрде кездеседі:</p>
<ul>
<li><b>Мәтін ішіндегі сілтеме</b> — «толығырақ 25-бетте жазылған» деген сияқты.</li>
<li><b>Әдебиеттер тізіміне сілтеме</b> — мәтіндегі <b>[1]</b>, <b>[2]</b> деген белгілер.</li>
<li><b>Дереккөзге сілтеме</b> — авторы, атауы, жылы, беті көрсетілген жазба.</li>
<li><b>Интернет сілтемесі</b> — сайттың толық мекенжайы (URL).</li>
</ul>

<div class="note note-important">
<b>Маңызды!</b>
<p>Сілтеме жасалған дереккөз нақты болуы керек. Ойдан құрастырылған дереккөз — бұл үлкен қате.</p>
</div>

<h3>Сілтемелерді құжатқа енгізу</h3>
<p>Мәтіндік редакторда сілтеме енгізу әдетте арнайы пәрмен арқылы орындалады. Көп редакторларда бұл пәрмен «Кірістіру» қойындысында орналасады.</p>

<h3>Сілтемелерді пайдалану ережелері</h3>
<ul>
<li>Сілтемені тек шынымен пайдаланған ақпаратқа жаса.</li>
<li>Дереккөздің авторын, атауын, жылын және бетін көрсет.</li>
<li>Интернет сілтемесінде сайттың толық мекенжайын жаз.</li>
<li>Сілтемені мәтіннің соңына жасырмай, тиісті жеріне қой.</li>
</ul>

<h3>Қадамдық нұсқаулық: құжатқа сілтеме қою</h3>
<ol>
<li>Сілтеме жасалатын мәтінді немесе сөзді белгіле.</li>
<li>«Кірістіру» қойындысын аш.</li>
<li>«Сілтеме» (Сноска / Ссылка) пәрменін таңда.</li>
<li>Сілтеме мәтінін жазып, оның орнын (беттің төменгі жағы немесе құжат соңы) таңда.</li>
<li>«Қою» батырмасын бас.</li>
</ol>

<div class="illus">
<span class="big">📑</span>
Иллюстрация орны: құжат бетінің төменгі жағында сілтеме белгісі <b>[1]</b> және оның түсіндірмесі көрсетілген.
</div>

<h3>Мысалдар</h3>
<p><b>Дұрыс:</b> «Абай Құнанбаев. Қара сөздер. — Алматы: Атамұра, 2019. — 45-бет.»</p>
<p><b>Дұрыс емес:</b> «Бір кітапта жазылған екен.»</p>

<div class="note note-remember">
<b>Есте сақта!</b>
<p>Нұсқама — <i>қалай істеу керектігін</i> айтады.<br>
Сілтеме — <i>ақпарат қайдан алынғанын</i> көрсетеді.<br>
Екеуі де мәтіндік құжаттың маңызды бөлігі.</p>
</div>

<div class="note note-practice">
<b>Практикада қолданып көр</b>
<p>Мәтіндік редакторда шағын мәтін жазып, оған бір сілтеме қос. Содан кейін сілтеме мәтінін өзгертіп көр.</p>
</div>

<div class="note note-check">
<b>Өзіңді тексер</b>
<p>1. Нұсқама мен сілтеменің айырмашылығы неде?</p>
<details><summary>Жауабын көрсету</summary>
Нұсқама әрекетті қалай орындау керектігін қадамдап түсіндіреді, ал сілтеме ақпараттың қайдан алынғанын көрсетеді.</details>
<p style="margin-top:12px">2. Дереккөзді көрсетпеу неге қате?</p>
<details><summary>Жауабын көрсету</summary>
Себебі ол басқа адамның еңбегін иемденуге әкеледі және оқырман ақпараттың дұрыстығын тексере алмайды.</details>
</div>
`,
  tasks:[
    {
      type:'match',
      title:'1-тапсырма. Сәйкестендір',

<p>Гиперсілтемені мәтіннен де, суреттен де жасауға болады. Әдетте ол көк түспен және асты сызылған күйде көрсетіледі. Тінтуір курсорын апарғанда ол «қол» белгісіне айналады.</p>

<b>Есте сақта!</b>
<p>Гиперсілтеме — сілтеменің ерекше түрі. Ол тек ақпарат көзін көрсетіп қана қоймай, басқан кезде сол жерге <b>апарады</b>.</p>

<h3>Авторлық құқық не үшін қажет?</h3>
<ul>
<li>Адамның еңбегін қорғайды.</li>
<li>Әділдікті сақтайды.</li>
<li>Адамдарды жаңа шығармалар жасауға ынталандырады.</li>
<li>Ақпараттың дұрыстығына кепілдік береді.</li>
</ul>

<h3>Интернеттен ақпаратты дұрыс пайдалану</h3>
<p>Интернетте көп ақпарат бар, бірақ оның бәрі «тегін» және «өзіңдікі» деген сөз емес. Ақпаратты пайдаланғанда мына ережелерді сақта:</p>
<ul>
<li>Ақпараттың авторын және дереккөзін көрсет.</li>
<li>Мәтінді сөзбе-сөз көшірмей, өз сөзіңмен жаз.</li>
<li>Суреттерді де авторын көрсетіп қана пайдалан.</li>
<li>Күмәнді дереккөздерге сенбе.</li>
</ul>

<h3>Плагиат дегеніміз не?</h3>
<p><b>Плагиат</b> — басқа адамның жұмысын, мәтінін, идеясын немесе суретін өзінің жұмысы ретінде көрсету.</p>

<div class="note note-important">
<b>Маңызды!</b>
<p>Плагиат — бұл әділетсіздік қана емес, сонымен қатар заң бұзушылық. Ол үшін жауапкершілік туындауы мүмкін.</p>
</div>

<h3>Плагиаттың мысалдары</h3>
<ul>
<li>Интернеттегі мәтінді көшіріп, авторын көрсетпей өз атыңнан жариялау.</li>
<li>Досыңның рефератын көшіріп тапсыру.</li>
<li>Басқаның суретін авторын көрсетпей өз жұмысыңа қою.</li>
<li>Бөтен идеяны өзіңдікі деп айту.</li>
</ul>

<h3>Ақпарат көзін көрсету</h3>
<p>Дереккөзді көрсету дегеніміз — ақпарат қайдан алынғанын нақты жазу. Мысалы:</p>
<div class="note note-example">
<b>Мысал</b>
<p>«Абай Құнанбаев. Қара сөздер. — Алматы: Атамұра, 2019. — 45-бет.»<br>
«Қазақстан тарихы. Электронды оқулық. https://example.kz (қаралған күні: 12.02.2025)»</p>
</div>

<h3>Дәйексөзді дұрыс пайдалану</h3>
<p><b>Дәйексөз</b> — басқа автордың сөзін өзгертпей келтіру. Дәйексөзді тырнақшаға алып, дереккөзін міндетті түрде көрсету керек.</p>

<h3>Өз сөзіңмен жазу</h3>
<p>Өз сөзіңмен жазу дегеніміз — оқыған ақпаратты түсініп, оны өз сөздеріңмен қайта баяндау. Бұл тәсіл:</p>
<ul>
<li>тақырыпты шынымен түсінгеніңді көрсетеді;</li>
<li>плагиаттан сақтайды;</li>
<li>жазу дағдыңды дамытады.</li>
</ul>

<h3>Интернеттегі суреттерді пайдалану ережелері</h3>
<ul>
<li>Суреттің авторын немесе дереккөзін көрсет.</li>
<li>Рұқсат қажет болса, авторынан сұра.</li>
<li>Суретті өзің салғандай көрсетпе.</li>
<li>Суретті бұрмалап, мағынасын өзгертпе.</li>
</ul>

<h3>Авторды құрметтеу</h3>
<p>Авторды құрметтеу дегеніміз — оның еңбегін мойындау, атын атау, дереккөзін көрсету. Бұл — әрбір білімді адамның міндеті.</p>

<h3>Дұрыс / Дұрыс емес мысалдары</h3>
<div class="note note-practice">
<b>Дұрыс</b>
<p>Мәтінді оқып, өз сөзіңмен қайта жазу және дереккөзді көрсету.</p>
</div>
<div class="note note-important">
<b>Дұрыс емес</b>
<p>Мәтінді көшіріп, дереккөзді көрсетпей өз атыңнан тапсыру.</p>
</div>

<div class="note note-practice">
<b>Практикада қолданып көр</b>

</div>

<h3>Мазмұн не үшін қажет?</h3>
<ul>

<p>Құжатқа жаңа тақырып қосылса, мазмұнды <b>жаңарту</b> керек. Ол үшін мазмұнды басып, «Өрісті жаңарту» пәрменін таңдайсың.</p>

  theory:`
<h3>Реферат дегеніміз не?</h3>
<p><b>Реферат</b> — белгілі бір тақырып бойынша жинақталған ақпаратты қысқаша, жүйелі түрде баяндайтын жазбаша жұмыс.</p>

<h3>Рефераттың мақсаты</h3>
<ul>
<li>Тақырыпты терең зерттеп, түсіну.</li>
<li>Ақпаратты жинақтап, негізгісін бөліп көрсету.</li>
<li>Өз ойыңды жүйелі жеткізу.</li>
<li>Дереккөздермен жұмыс істеу дағдысын дамыту.</li>
</ul>

<h3>Рефераттың құрылымы</h3>
<ol>
<li>Титулдық бет</li>
<li>Мазмұны</li>
<li>Кіріспе</li>
<li>Негізгі бөлім</li>
<li>Қорытынды</li>
<li>Пайдаланылған әдебиеттер</li>
</ol>

<h3>Титулдық бет</h3>
<p>Титулдық бет — рефераттың «бет-пердесі». Онда мыналар көрсетіледі:</p>
<ul>
<li>мектептің атауы;</li>
<li>тақырыптың атауы;</li>

<p>Мазмұнда рефераттың барлық бөлімдері және олардың бет нөмірлері көрсетіледі.</p>

<h3>Кіріспе</h3>
<p>Кіріспеде тақырыптың маңыздылығы, жұмыстың мақсаты мен міндеттері жазылады. Кіріспе шағын болуы керек — әдетте жарты беттен аспайды.</p>

<h3>Қорытынды</h3>
<p>Қорытындыда жұмыстың негізгі нәтижелері мен тұжырымдары қысқаша жазылады. Жаңа ақпарат қосылмайды.</p>

<h3>Пайдаланылған әдебиеттер</h3>
<p>Мұнда жұмыс барысында пайдаланылған барлық кітаптар, мақалалар және сайттар тізімі көрсетіледі.</p>

<li>Жоспар құр.</li>
<li>Ақпаратты бірнеше сенімді дереккөзден жина.</li>
<li>Мәтінді өз сөзіңмен жаз.</li>
<li>Дереккөздерді міндетті түрде көрсет.</li>
<li>Жұмысты тексеріп, қателерін түзет.</li>
</ul>

<h3>Ақпаратты іздеу</h3>
<p>Ақпаратты кітапханадан, электронды оқулықтардан, энциклопедиялардан және сенімді веб-сайттардан іздеу керек. Әлеуметтік желілердегі тексерілмеген пікірлерге сүйенуге болмайды.</p>

<h3>Ақпаратты талдау</h3>
<p>Талдау дегеніміз — ақпаратты оқып, керектісін таңдап, салыстырып, қорытынды жасау. Барлық ақпаратты сөзбе-сөз көшіру дұрыс емес.</p>

<h3>Өз сөзімен жазу</h3>
<p>Оқыған ақпаратты түсініп, өз сөздеріңмен қайта баянда. Бұл — рефераттың сапасын арттыратын басты шарт.</p>

<h3>Авторлық құқықты сақтау</h3>
<p>Пайдаланған әрбір дереккөзді көрсет. Басқа автордың сөзін тырнақшаға алып, авторын жаз.</p>

<div class="note note-remember">
<b>Жақсы реферат қандай болады?</b>
<ul style="margin-bottom:0">
<li>Нақты және дұрыс құрылымға ие.</li>
<li>Мазмұны тақырыпқа толық сай келеді.</li>

  theory:`

<p>Практикалық жұмыс — теорияда үйренген білімді компьютерде нақты орындап көру. Әр тапсырманың <b>мақсаты</b>, <b>орындау қадамдары</b>, <b>нәтижесі</b> және <b>бағалау критерийлері</b> болады.</p>

<h3>1-тапсырма. «Менің сүйікті пәнім» мәтінін құру</h3>

<h3>2-тапсырма. Тақырып және бөлімдер енгізу</h3>

<p><b>Қадамдары:</b></p>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shuffleQuestion(q){
  const idx = q.options.map((o,i)=>({o,i}));
  const sh = shuffle(idx);
  return {
    q: q.q,
    options: sh.map(x=>x.o),
    correct: sh.findIndex(x=>x.i === q.correct)
  };
}

function completedCount(){
  return Object.keys(state.completed).filter(k=>state.completed[k]).length;
}

function percentOfTopic(id){
  const r = state.results[id];

}

function go(view, param){
  state.view = view;
  if(param !== undefined) state.topicId = param;
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}

function openTopic(id, tab){
  state.topicId = id;
  state.tab = tab || 'theory';
  go('topic');
}

/* =========================================================
   ИНТЕРАКТИВТІ ТАПСЫРМАЛАР
   ========================================================= */
function renderTask(task, ti){
  let html = '<div class="task" data-type="'+task.type+'" data-ti="'+ti+'" data-correct="'+(task.correct!==undefined?task.correct:'')+'">';
  html += '<h4>'+task.title+'</h4>';
  if(task.instruction) html += '<p class="task-instr">'+task.instruction+'</p>';

  if(task.type === 'match'){
    const rights = shuffle(task.pairs.map((p,i)=>({t:p.right, i})));
    html += '<div class="match-list">';
    task.pairs.forEach((p,li)=>{
      html += '<div class="match-row">';
      html += '<div class="match-left">'+p.left+'</div>';
      html += '<select class="match-select" data-li="'+li+'">';
      html += '<option value="-1">— түсіндірмені таңдаңыз —</option>';
      rights.forEach(r=>{
        html += '<option value="'+r.i+'">'+r.t+'</option>';
      });
      html += '</select></div>';
    });
    html += '</div>';
  }

  else if(task.type === 'order'){
    const items = shuffle(task.items.map((t,i)=>({t,i})));
    html += '<ul class="order-list">';
    items.forEach(it=>{
      html += '<li class="order-item" data-i="'+it.i+'">';
      html += '<span class="order-text">'+it.t+'</span>';
      html += '<span class="order-btns">';
      html += '<button class="mini" type="button" onclick="moveItem(this,-1)">▲</button>';
      html += '<button class="mini" type="button" onclick="moveItem(this,1)">▼</button>';
      html += '</span></li>';
    });
    html += '</ul>';
  }

  else if(task.type === 'classify'){
    task.items.forEach((it,i)=>{
      html += '<div class="cls-row">';
      html += '<div class="cls-text">'+(i+1)+'. '+it.text+'</div>';
      html += '<select class="cls-select" data-g="'+it.g+'">';
      html += '<option value="-1">— таңдаңыз —</option>';
      task.groups.forEach((g,gi)=>{
        html += '<option value="'+gi+'">'+g+'</option>';
      });
      html += '</select></div>';
    });
  }

  else if(task.type === 'choice'){
    task.options.forEach((o,i)=>{
      html += '<button class="opt" type="button" data-i="'+i+'" onclick="pickOption(this)">'+o+'</button>';
    });
  }

  html += '<div class="btn-row"><button class="btn btn-primary" onclick="checkTask(this)">Тексеру</button></div>';
  html += '<div class="task-feedback"></div>';
  html += '</div>';
  return html;
}

function moveItem(btn, dir){
  const li = btn.closest('.order-item');
  const list = li.parentElement;
  if(dir === -1 && li.previousElementSibling){
    list.insertBefore(li, li.previousElementSibling);
  } else if(dir === 1 && li.nextElementSibling){
    list.insertBefore(li.nextElementSibling, li);
  }
  // таңбалауларды тазалау
  list.querySelectorAll('.order-item').forEach(x=>x.classList.remove('good','bad'));
  const fb = list.closest('.task').querySelector('.task-feedback');
  if(fb){ fb.textContent=''; fb.className='task-feedback'; }
}

function pickOption(btn){
  const task = btn.closest('.task');
  task.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected','good','bad'));
  btn.classList.add('selected');
  const fb = task.querySelector('.task-feedback');
  if(fb){ fb.textContent=''; fb.className='task-feedback'; }
}

function checkTask(btn){
  const task = btn.closest('.task');
  const type = task.dataset.type;
  const fb = task.querySelector('.task-feedback');
  let ok = true;

  if(type === 'match'){
    task.querySelectorAll('.match-select').forEach(s=>{
      s.classList.remove('good','bad');
      const good = Number(s.value) === Number(s.dataset.li);
      if(!good) ok = false;
      s.classList.add(good ? 'good' : 'bad');
    });
  }
  else if(type === 'order'){
    const items = Array.from(task.querySelectorAll('.order-item'));
    items.forEach((li,i)=>{
      li.classList.remove('good','bad');
      const good = Number(li.dataset.i) === i;
      if(!good) ok = false;
      li.classList.add(good ? 'good' : 'bad');
    });
  }
  else if(type === 'classify'){
    task.querySelectorAll('.cls-select').forEach(s=>{
      s.classList.remove('good','bad');
      const good = Number(s.value) === Number(s.dataset.g);
      if(!good) ok = false;
      s.classList.add(good ? 'good' : 'bad');
    });
  }
  else if(type === 'choice'){
    const sel = task.querySelector('.opt.selected');
    const correct = Number(task.dataset.correct);
    task.querySelectorAll('.opt').forEach(o=>{
      o.classList.remove('good','bad');
      const isCorr = Number(o.dataset.i) === correct;
      if(isCorr) o.classList.add('good');
      else if(o.classList.contains('selected')) o.classList.add('bad');
    });
    if(!sel || Number(sel.dataset.i) !== correct) ok = false;
  }

  fb.textContent = ok ? '✓ Дұрыс!' : '✗ Қате, қайта көріңіз.';
  fb.className = 'task-feedback ' + (ok ? 'ok' : 'no');
}

    return;
  }
  box.innerHTML = '<div class="test-box"><h3 style="margin-top:0">🔍 Қате жауаптарды талдау</h3>' +
    r.wrong.map((w,i)=>`
      <div class="wrong-item">
        <div class="qq">${i+1}. ${w.q}</div>
        <div class="ans">
          <span class="giv">✗ Сенің жауабың: ${w.given}</span>
          <span class="cor">✓ Дұрыс жауап: ${w.correct}</span>
        </div>
      </div>`).join('') + '</div>';
  box.scrollIntoView({behavior:'smooth'});
}

/* =========================================================
   ТЕСТ ЖҮРГІЗУ
   ========================================================= */
function startTopicTest(topicId){
  const t = topics.find(x=>x.id === topicId);
  const qs = t.test.map(shuffleQuestion);
  session = {
    mode:'topic',
    topicId: topicId,
    title: t.code + '. ' + t.title,
    questions: qs,
    index: 0,
    answers: new Array(qs.length).fill(null)
  };
  state.view = 'testrun';
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function startFinalTest(){
  const qs = shuffle(finalQuestionsRaw.map(shuffleQuestion));
  session = {
    mode:'final',
    topicId: null,
    title: 'Қорытынды тест',
    questions: qs,
    index: 0,
    answers: new Array(qs.length).fill(null)
  };
  state.view = 'testrun';
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function viewTestRun(){
  if(!session) return viewHome();
  const q = session.questions[session.index];
  const total = session.questions.length;
  const n = session.index + 1;
  const pct = Math.round((session.index)/total*100);
  const chosen = session.answers[session.index];
  const isLast = session.index === total - 1;
  const answeredCount = session.answers.filter(a=>a !== null).length;

  return `
  <div class="test-box">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div class="q-counter">${session.title}</div>
      <div class="q-counter" style="color:#8b5cf6">${n} / ${total}</div>
    </div>
    <div class="progress-bar" style="margin:10px 0 20px"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="q-text">${q.q}</div>
    <div id="opts">
      ${q.options.map((o,i)=>`<button class="opt${chosen===i?' selected':''}" type="button" onclick="answerQ(${i})">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}
    </div>

    <div class="btn-row" style="justify-content:space-between;margin-top:20px">
      <div>
        ${session.index > 0 ? '<button class="btn btn-ghost" onclick="prevQ()">← Артқа</button>' : ''}
      </div>
      <div>
        ${isLast
          ? '<button class="btn btn-purple" onclick="finishTest()" '+(chosen===null?'disabled':'')+'>Аяқтау ✓</button>'
          : '<button class="btn btn-primary" onclick="nextQ()" '+(chosen===null?'disabled':'')+'>Келесі →</button>'}
      </div>
    </div>
    <p style="margin-top:14px;color:#6b7280;font-size:14.5px">Жауап берілген сұрақтар: ${answeredCount} / ${total}</p>
  </div>`;
}

function answerQ(i){
  if(!session) return;
  session.answers[session.index] = i;
  render();
}

function nextQ(){
  if(!session) return;
  if(session.index < session.questions.length - 1){
    session.index++;
    window.scrollTo({top:0,behavior:'smooth'});
    render();
  }
}

function prevQ(){
  if(!session) return;
  if(session.index > 0){
    session.index--;
    window.scrollTo({top:0,behavior:'smooth'});
    render();
  }
}

function finishTest(){
  if(!session) return;
  const total = session.questions.length;
  let correct = 0;
  const wrong = [];
  session.questions.forEach((q,i)=>{
    if(session.answers[i] === q.correct) correct++;
    else wrong.push({
      q: q.q,
      correct: q.options[q.correct],
      given: session.answers[i] === null ? 'Жауап берілмеді' : q.options[session.answers[i]]
    });
  });
  const percent = Math.round(correct/total*100);
  const result = {correct, total, percent, wrong, date: Date.now()};

  lastMode = session.mode;
  lastTopicId = session.topicId;
  lastResult = result;

  if(session.mode === 'topic'){
    state.results[session.topicId] = result;
    if(percent >= 50) state.completed[session.topicId] = true;
  } else {
    state.finalResult = result;
  }
  saveState();
  session = null;
  state.view = 'testresult';
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

/* =========================================================
   ТЕСТ НӘТИЖЕСІ
   ========================================================= */
function viewTestResult(){
  if(!lastResult) return viewHome();
  const r = lastResult;
  const fb = feedbackFor(r.percent);
  const color = r.percent>=75 ? '#16a34a' : (r.percent>=50 ? '#f59e0b' : '#dc2626');
  const isTopic = lastMode === 'topic';
  const t = isTopic ? topics.find(x=>x.id === lastTopicId) : null;

  return `
  <div class="test-box">
    <div class="q-counter">${isTopic ? (t.code + '. ' + t.title) : 'Қорытынды тест'}</div>
    <h1 style="margin:6px 0 4px">Нәтиже</h1>

    <div style="text-align:center;margin:22px 0">
      <div class="result-big" style="background:linear-gradient(90deg,${color},#8b5cf6);-webkit-background-clip:text;background-clip:text">${r.percent}%</div>
      <div style="font-size:20px;font-weight:800;color:${color};margin-top:6px">${fb.title}</div>
      <p style="color:#6b7280;margin-top:6px">${fb.text}</p>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="num" style="color:#16a34a">${r.correct}</div><div class="lbl">Дұрыс жауап</div></div>
      <div class="stat"><div class="num" style="color:#dc2626">${r.total - r.correct}</div><div class="lbl">Қате жауап</div></div>
      <div class="stat"><div class="num">${r.total}</div><div class="lbl">Барлық сұрақ</div></div>
      <div class="stat"><div class="num">${r.percent}%</div><div class="lbl">Пайыздық нәтиже</div></div>
    </div>

    ${r.percent>=90 ? '<p style="font-weight:700;color:#16a34a">Баға: 5 (өте жақсы)</p>' :
      r.percent>=75 ? '<p style="font-weight:700;color:#16a34a">Баға: 4 (жақсы)</p>' :
      r.percent>=50 ? '<p style="font-weight:700;color:#f59e0b">Баға: 3 (қанағаттанарлық)</p>' :
      '<p style="font-weight:700;color:#dc2626">Баға: 2 (қайталау қажет)</p>'}

    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-primary" onclick="${isTopic ? 'startTopicTest(\''+lastTopicId+'\')' : 'startFinalTest()'}">🔄 Қайта тапсыру</button>
      ${isTopic ? '<button class="btn btn-outline" onclick="openTopic(\''+lastTopicId+'\',\'theory\')">📘 Теорияны қайта оқу</button>' : ''}
      <button class="btn btn-ghost" onclick="go('${isTopic?'topics':'results'}')">${isTopic?'📚 Тақырыптарға қайту':'📊 Менің нәтежемге өту'}</button>
    </div>
  </div>

  ${r.wrong.length > 0 ? `
  <div class="test-box" style="margin-top:20px">
    <h3 style="margin-top:0">🔍 Қате жауаптарды қайта қарау</h3>
    ${r.wrong.map((w,i)=>`
      <div class="wrong-item">
        <div class="qq">${i+1}. ${w.q}</div>
        <div class="ans">
          <span class="giv">✗ Сенің жауабың: ${w.given}</span>
          <span class="cor">✓ Дұрыс жауап: ${w.correct}</span>
        </div>
      </div>`).join('')}
  </div>` : `
  <div class="test-box" style="margin-top:20px;text-align:center">
    <p style="font-size:22px;font-weight:800;color:#16a34a">🎉 Барлық жауап дұрыс!</p>
  </div>`}
  `;
}

/* =========================================================
   ҚОРЫТЫНДЫ ТЕСТ
   ========================================================= */
function viewFinalIntro(){
  const r = state.finalResult;
  let last = '';
  if(r){
    const fb = feedbackFor(r.percent);
    last = `
      <h3>Соңғы нәтиже</h3>
      <div class="stat-grid">
        <div class="stat"><div class="num">${r.correct}</div><div class="lbl">Дұрыс</div></div>
        <div class="stat"><div class="num">${r.total - r.correct}</div><div class="lbl">Қате</div></div>
        <div class="stat"><div class="num">${r.percent}%</div><div class="lbl">Нәтиже</div></div>
      </div>
      <p style="font-weight:700">${fb.title}</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="startFinalTest()">🔄 Қайта тапсыру</button>
      </div>`;
  } else {
    last = `<div class="btn-row"><button class="btn btn-purple" onclick="startFinalTest()">▶️ Қорытынды тестті бастау</button></div>`;
  }

  return `
  <h1>🎯 Қорытынды тест</h1>
  <p style="color:#6b7280">4.1, 4.2–4.3 және 4.4 тақырыптарынан аралас 30 сұрақ.</p>
  <div class="test-box" style="margin-top:18px">
    <h3 style="margin-top:0">Ережелер</h3>
    <ul>
      <li>Барлығы <b>30 сұрақ</b></li>
      <li>Әр сұрақта <b>4 жауап нұсқасы</b>, тек біреуі дұрыс</li>
      <li>Сұрақтар <b>аралас ретпен</b> көрсетіледі</li>
      <li>Жауап бергеннен кейін бірден дұрыс/қате көрсетілмейді</li>
      <li>Нәтиже <b>барлық 30 сұрақ аяқталғаннан кейін ғана</b> шығады</li>
    </ul>
    <h3>Бағалау шкаласы</h3>
    <ul>
      <li><b>90–100%</b> — «Өте жақсы!»</li>
      <li><b>75–89%</b> — «Жақсы!»</li>
      <li><b>50–74%</b> — «Қанағаттанарлық. Тағы да қайталап көр.»</li>
      <li><b>0–49%</b> — «Тақырыптарды қайта оқып шық.»</li>
    </ul>
    ${last}
  </div>`;
}

/* =========================================================
   МЕНІҢ НӘТИЖЕМ
   ========================================================= */
function viewResults(){
  const done = completedCount();
  const total = topics.length;

  const resultsList = topics.map(t=>{
    const r = state.results[t.id];
    const pct = r ? r.percent : null;
    const status = state.completed[t.id] ? '✓ Аяқталды' : (r ? 'Тапсырылды' : 'Тапсырылмаған');
    const color = pct===null ? '#6b7280' : (pct>=75 ? '#16a34a' : (pct>=50 ? '#f59e0b' : '#dc2626'));
    return `
      <div class="list-link">
        <div>
          <div class="t">${t.code}. ${t.title}</div>
          <div class="s">${status} ${r ? '• '+r.correct+'/'+r.total+' дұрыс • '+pct+'%' : ''}</div>
        </div>
        <div style="font-size:22px;font-weight:800;color:${color}">${pct===null?'—':pct+'%'}</div>
      </div>`;
  }).join('');

  const percents = topics.map(t=>state.results[t.id]).filter(Boolean).map(r=>r.percent);
  const avg = percents.length ? Math.round(percents.reduce((a,b)=>a+b,0)/percents.length) : null;
  const fr = state.finalResult;

  return `
  <h1>📊 Менің нәтижем</h1>
  <p style="color:#6b7280">Осы бөлімде оқу барысың мен тест нәтижелерің көрсетіледі.</p>

  ${progressBarHtml()}

  <div class="stat-grid">
    <div class="stat"><div class="num">${done}/${total}</div><div class="lbl">Аяқталған тақырып</div></div>
    <div class="stat"><div class="num">${percents.length}</div><div class="lbl">Тапсырылған тест</div></div>
    <div class="stat"><div class="num">${avg===null?'—':avg+'%'}</div><div class="lbl">Орташа пайыз</div></div>
    <div class="stat"><div class="num">${fr?fr.percent+'%':'—'}</div><div class="lbl">Қорытынды тест</div></div>
  </div>

  <div class="section-title"><span class="ic">📋</span> Тақырыптар бойынша нәтиже</div>
  ${resultsList}

  <div class="section-title"><span class="ic">🎯</span> Қорытынды тест нәтижесі</div>
  ${fr ? `
    <div class="test-box">
      <div class="stat-grid">
        <div class="stat"><div class="num" style="color:#16a34a">${fr.correct}</div><div class="lbl">Дұрыс</div></div>
        <div class="stat"><div class="num" style="color:#dc2626">${fr.total-fr.correct}</div><div class="lbl">Қате</div></div>
        <div class="stat"><div class="num">${fr.percent}%</div><div class="lbl">Нәтиже</div></div>
      </div>
      <p style="font-weight:800;font-size:19px">${feedbackFor(fr.percent).title}</p>
      <p style="color:#6b7280">${feedbackFor(fr.percent).text}</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="startFinalTest()">🔄 Қайта тапсыру</button>
      </div>
    </div>
  ` : '<div class="test-box"><p style="color:#6b7280">Қорытынды тест әлі тапсырылмаған.</p><div class="btn-row"><button class="btn btn-purple" onclick="go(\'final\')">🎯 Қорытынды тестті бастау</button></div></div>'}

  <div class="test-box" style="margin-top:22px">
    <h3 style="margin-top:0">⚙️ Деректерді басқару</h3>
    <p style="color:#6b7280">Нәтижелер браузерде автоматты түрде сақталады. Қаласаң, барлық нәтижені өшіріп, қайтадан бастай аласың.</p>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="resetAll()">🗑️ Барлық нәтижені өшіру</button>
    </div>
  </div>`;
}

function resetAll(){
  if(confirm('Барлық нәтиже өшіріледі. Сенімдісің бе?')){
    state.completed = {};
    state.results = {};
    state.finalResult = null;
    saveState();
    go('results');
  }
}

/* =========================================================
   ІСКЕ ҚОСУ
   ========================================================= */
loadState();
render();
</script>
</body>
</html>
